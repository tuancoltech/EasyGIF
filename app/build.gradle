plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.compose.compiler)
}

def localProps = new Properties()
file("${rootProject.projectDir}/local.properties").withInputStream { localProps.load(it) }

android {
  signingConfigs {
    debug {
      storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      storeFile file(localProps['signing.keystore'])
      storePassword localProps['signing.keystore.password']
      keyAlias localProps['signing.key.alias']
      keyPassword localProps['signing.key.password']
    }
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }
  defaultConfig {
    applicationId "com.nht.gif"
    // ffmpeg-kit ships an armeabi-v7a slice, but gifsicle and MMKV 2.x do not support
    // 32-bit. On 32-bit-only devices (e.g. Redmi 9C) that stray slice makes the whole
    // process run 32-bit, and MMKV throws UnsupportedArchitectureException at launch.
    // arm64-v8a is the only ABI where ffmpeg + gifsicle + MMKV all work, so ship only it.
    ndk {
      abiFilters 'arm64-v8a'
    }
    minSdk 29
    targetSdk 36
    compileSdk 36
    versionCode 202607001
    versionName '2026.7.1'
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    setProperty "archivesBaseName", "EasyGIF_${versionName}_${versionCode}"
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      debuggable false
    }
    debug {
      signingConfig signingConfigs.debug
      applicationIdSuffix '.debug'
      minifyEnabled false
      shrinkResources false
      debuggable true
    }
  }
  buildFeatures {
    viewBinding true
    buildConfig true
    compose true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.toString()
  }
  namespace 'com.nht.gif'
}

dependencies {

  // libgifsicle.so has been imported into the jniLibs directory.
  // It was cloned and compiled from https://github.com/kohler/gifsicle on January 9, 2024.

  // OutlineSpan.kt was cloned from https://github.com/santaevpavel/OutlineSpan on February 1, 2024.

  implementation platform(libs.compose.bom)
  implementation libs.compose.ui
  implementation libs.compose.ui.tooling.preview
  implementation libs.compose.material3
  implementation libs.compose.foundation
  implementation libs.activity.compose
  debugImplementation libs.compose.ui.tooling

  implementation libs.androidx.core.ktx
  implementation libs.androidx.appcompat
  implementation libs.androidx.draganddrop
  implementation libs.material
  implementation libs.glide
  implementation libs.android.image.cropper
  implementation(files("libs/ffmpeg-kit.aar"))
  // This dependency is mandatory to avoid "SmartException" errors
  implementation libs.smart.exception.java
  implementation libs.mmkv
  implementation libs.kotlinx.coroutines.android
  implementation libs.lifecycle.viewmodel.ktx

  annotationProcessor libs.glide.compiler

  testImplementation libs.junit
  testImplementation libs.mockk
  testImplementation libs.kotlinx.coroutines.test

  androidTestImplementation libs.androidx.test.junit
  androidTestImplementation libs.androidx.test.rules
  androidTestImplementation libs.espresso.core
}
