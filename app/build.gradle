def localProps = new Properties()
file("${rootProject.projectDir}/local.properties").withInputStream { localProps.load(it) }

android {
  signingConfigs {
    debug {
      storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      storeFile file(localProps['signing.keystore'])
      storePassword localProps['signing.keystore.password']
      keyAlias localProps['signing.key.alias']
      keyPassword localProps['signing.key.password']
    }
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }
  defaultConfig {
    applicationId "com.nht.gif"
    minSdk 29
    targetSdk 35
    compileSdk 36
    versionCode 202605002
    versionName '2026.5.2'
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    setProperty "archivesBaseName", "EasyGIF_${versionName}_${versionCode}"
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
